[workspace]
resolver = "3"
exclude = [
    "vendor/objc2-app-kit",
    "vendor/plushie-iced-core",
    "vendor/plushie-iced-graphics",
    "vendor/plushie-iced-widget",
    "vendor/plushie-iced-futures",
    "vendor/plushie-iced-winit",
]

[patch.crates-io]
objc2-app-kit = { path = "vendor/objc2-app-kit" }
plushie-iced-core = { path = "vendor/plushie-iced-core" }
plushie-iced-graphics = { path = "vendor/plushie-iced-graphics" }
plushie-iced-widget = { path = "vendor/plushie-iced-widget" }
plushie-iced-futures = { path = "vendor/plushie-iced-futures" }
plushie-iced-winit = { path = "vendor/plushie-iced-winit" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gantbd/vellum-gui-macos"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "vellum-gui-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
description = "Composable Iced presentation and standalone macOS GUI for Vellum"
autoexamples = false

[lib]
name = "vellum_gui_macos"

[[bin]]
name = "vellum-gui-macos"
path = "src/main.rs"

[features]
# Explicit live-window probe; never enabled by normal app builds.
desktop-qualification = []

[[example]]
name = "iced-interaction"
path = "examples/interaction.rs"

[dependencies]
vellum-adapter-clipboard-macos = { version = "=0.1.0", path = "../vellum/adapters/clipboard-macos" }
vellum-adapter-local-fs = { version = "=0.1.0", path = "../vellum/adapters/local-fs" }
vellum-adapter-annotation-json = { version = "=0.1.0", path = "../vellum/adapters/annotation-json" }
vellum-adapter-unicode-icu = { version = "=0.1.0", path = "../vellum/adapters/unicode-icu" }
vellum-model = { package = "vellum-editor", version = "=0.1.0", path = "../vellum/host/vellum-editor", features = ["native-unicode"] }
vellum-engine = { version = "=0.1.0", path = "../vellum/engine/vellum-engine" }
vellum-session = { version = "=0.1.0", path = "../vellum/host/vellum-session" }
vellum-sdk-client = { version = "=0.1.0", path = "../vellum/sdk/client" }
vellum-adapter-local-authentication = { version = "=0.1.0", path = "../vellum/adapters/local-authentication" }
unicode-segmentation = "=1.13.3"
iced = { package = "plushie-iced", version = "=0.8.4", default-features = false, features = ["a11y", "tiny-skia", "basic-shaping", "thread-pool", "tokio", "advanced"] }

[dev-dependencies]
serde_json = "=1.0.151"

[lints]
workspace = true
